# Render blueprint — ONE web service (Docker) serving the React build + the API,
# plus a managed Postgres. This file must sit at the repo root (it does).
#
# Deploy:
#   1. Push to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick this repo.
#   3. On the `risk-explainer` service -> Environment tab, set GROQ_API_KEY
#      (a fresh key from https://console.groq.com/keys).

services:
  - type: web
    name: risk-explainer
    runtime: docker
    dockerfilePath: ./risk-explainer/Dockerfile
    dockerContext: ./risk-explainer
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false            # secret — set it in the dashboard, not here
      - key: DATABASE_URL
        fromDatabase:
          name: risk-explainer-db
          property: connectionString

databases:
  - name: risk-explainer-db
    plan: free
