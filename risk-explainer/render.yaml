# Render.com blueprint for the backend + a managed Postgres.
# Vercel hosts the frontend; it cannot run this FastAPI service.
#
# Deploy: push to GitHub, then on Render "New > Blueprint" and point it at this
# file. After the first deploy, set GROQ_API_KEY and CORS_ORIGINS in the
# service's Environment tab (CORS_ORIGINS = your Vercel URL).

services:
  - type: web
    name: risk-explainer-api
    runtime: python
    rootDir: risk-explainer/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: risk-explainer-db
          property: connectionString

databases:
  - name: risk-explainer-db
    plan: free
